name: CI
on: [push, pull_request]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        poetry-version: ["1.8.2"]
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      POETRY_NO_INTERACTION: "1"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install pipx
        shell: bash
        run: |
          python -m pip install --upgrade pip pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if [[ -n "$USERPROFILE" ]]; then
            echo "$USERPROFILE\\.local\\bin" >> "$GITHUB_PATH"
          fi

      - name: Install Poetry (${{ matrix.poetry-version }}) via pipx
        shell: bash
        run: |
          PYBIN="$(python -c 'import sys; print(sys.executable)')"
          pipx install "poetry==${{ matrix.poetry-version }}" --python "$PYBIN"
          poetry --version

      - name: Cache .venv
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run pytest
