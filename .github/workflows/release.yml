name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry

      - name: Extract version from files
        id: version_check
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"

          PYPROJECT_VERSION=$(grep -Po '(?<=^version = ")[^"]+' pyproject.toml)
          INIT_VERSION=$(grep -Po '(?<=^__version__ = ")[^"]+' shinkansen/__init__.py)

          echo "Tag: $TAG"
          echo "Version from pyproject.toml: $PYPROJECT_VERSION"
          echo "Version from __init__.py: $INIT_VERSION"

          if [ "$PYPROJECT_VERSION" != "$VERSION" ]; then
            echo "❌ Version mismatch between tag and pyproject.toml"
            exit 1
          fi

          if [ "$INIT_VERSION" != "$VERSION" ]; then
            echo "❌ Version mismatch between tag and __init__.py"
            exit 1
          fi

          echo "✅ Versions match"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure Poetry for PyPI
        run: poetry config http-basic.pypi __token__ ${{ secrets.PYPI_TOKEN }}

      - name: Build and publish
        run: |
          poetry build
          poetry publish
